<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simo Connect</title>
  <style>
    :root { color-scheme: dark; background: #0b1220; color: #edf3ff; font: 14px/1.5 system-ui, sans-serif; }
    body { margin: 0; }
    .app-shell, .connect-sign-in { padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    a { color: #a0d7ff; }
    #simoConnectToolbarR1068 .simo-connect-mobile-modes { display: flex; flex-wrap: wrap; gap: 8px; }
    #simoConnectToolbarR1068 button { background: #163753; color: inherit; border: 1px solid #52799b; border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
    #simoConnectToolbarR1068 button[data-call-state="active"] { background: #075332; border-color: #82ffc0; }
    #simoConnectToolbarR1068 button:focus-visible { outline: 2px solid #a0d7ff; outline-offset: 2px; }
    body #simoConnectPillDock { display: none; }
    body #simoMessagesPanel, body #simoCallingPanel {
      box-sizing: border-box; inset: 0 !important; width: 100% !important; max-width: none !important;
      max-height: none !important; border-radius: 0; overflow: auto; overscroll-behavior: contain;
    }
    body #simoCallMini { right: 12px; bottom: 12px; }
    body.simo-extension-call-banner #simoCallMini { display: none !important; }
    body #simoOutgoingRing { top: 12px; }
    body.simo-extension-call-banner #simoIncomingRing,
    body.simo-extension-call-banner #simoCallAnswer { display: none !important; }
    body #simoConnectNotice, body #simoCallNotice { top: auto !important; bottom: 12px; }
    #simoMessagesPanel .sc-composer {
      --action-gap: 8px;
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 var(--action-gap);
    }
    #simoMessagesPanel .sc-composer > * { grid-column: 1 / -1; }
    #simoMessagesPanel .sc-composer > .sc-message-label { grid-row: 1; }
    #simoMessagesPanel .sc-composer > .sc-tool-row {
      grid-area: 2 / 1 / 3 / 3; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--action-gap); margin-top: 8px;
    }
    #simoMessagesPanel .sc-composer > .sc-compose-actions { grid-area: 2 / 3; align-self: start; margin-top: 8px; }
    #simoMessagesPanel .sc-composer > :is(.sc-tool-row, .sc-compose-actions) button {
      display: grid; place-items: center; width: 100%; min-width: 0; height: 40px;
      margin: 0; padding: 4px; font-size: 13px; line-height: 1.2; text-align: center;
    }
    @media (max-width: 305px) {
      #simoMessagesPanel .sc-composer > :is(.sc-tool-row, .sc-compose-actions) button { font-size: 12px; }
    }
  </style>
  {% if view_token %}
  <script src="{{ url_for('static', filename='simo-connect-extension.js', v='chrome-030') }}" defer></script>
  <script src="{{ url_for('static', filename='simo-calling-beta.js', v='website-answer-2') }}" defer></script>
  <script src="{{ url_for('static', filename='simo-connect-messages.js', v='chrome-030') }}" defer></script>
  {% endif %}
</head>
<body{% if view_token %} data-connect-view="{{ view_token }}" data-extension-origin="{{ extension_origin }}"{% endif %}>
  {% if view_token %}
  <main class="app-shell">
    <h1>Simo Connect</h1>
    <div id="simoConnectToolbarR1068" aria-label="Simo Connect tools"></div>
  </main>
  {% else %}
  <main class="connect-sign-in">
    <h1>Simo Connect</h1>
    <p>Sign in to open your conversations and make calls.</p>
    <a href="/" target="_blank" rel="noopener">Open Simo to sign in</a>
  </main>
  {% endif %}
</body>
</html>
