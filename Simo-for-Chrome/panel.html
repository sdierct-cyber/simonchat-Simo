<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simo</title>
  <link rel="stylesheet" href="panel.css">
  <script src="panel.js" type="module"></script>
</head>
<body>
  <header>
    <div class="brand"><img src="icons/48.png" alt=""><h1>Simo</h1></div>
    <a id="home" target="_blank" rel="noopener">Open Simo ↗</a>
  </header>
  <div class="account">
    <span id="account" role="status">Connecting to Simo…</span>
    <button id="refresh" type="button" class="quiet">Refresh</button>
  </div>
  <details class="connection">
    <summary>Connection</summary>
    <label for="server">Simo server</label>
    <select id="server">
      <option value="live">Live · simonchat.ai</option>
      <option value="local">Local · Flask</option>
    </select>
  </details>
  <nav class="panel-modes" aria-label="Simo panel views">
    <button id="show-chat" type="button" class="quiet" aria-pressed="true" aria-controls="chat-view">Chat</button>
    <button id="show-connect" type="button" class="quiet" aria-pressed="false" aria-controls="connect-view">Simo Connect</button>
  </nav>
  <div id="call-banner" hidden>
    <span id="call-banner-status" role="status"></span>
    <button id="call-banner-open" type="button" class="quiet">Open call</button>
    <button id="call-banner-end" type="button" class="quiet">Hang up</button>
  </div>
  <section id="chat-view" class="panel-view" aria-label="Simo chat">
  <details>
    <summary>Workspaces</summary>
    <nav aria-label="Simo workspaces">
      <a data-path="/#simo-extension-website">Website Builder</a>
      <a data-path="/#simo-extension-design">Design Workspace</a>
      <a data-path="/#simo-extension-library">Library</a>
      <a data-path="/video">Short Video</a>
      <a data-path="/video/long">Long Video</a>
      <a data-path="/chrome">Simo for Chrome</a>
      <a id="connect-shortcut" href="#connect-view">Simo Connect</a>
    </nav>
  </details>
  <main id="conversation" role="log" aria-label="Conversation">
    <p id="welcome">Ask Simo a question or right-click highlighted text on a page to bring it here.</p>
  </main>
  <form id="composer">
    <div id="selection" class="draft" hidden>
      <div><strong>Selected text</strong><button id="remove-text" type="button" class="quiet" aria-label="Remove selected text">Remove</button></div>
      <blockquote id="quote"></blockquote>
    </div>
    <div id="attachment" class="draft" hidden>
      <div><strong id="filename"></strong><button id="remove-image" type="button" class="quiet" aria-label="Remove image">Remove</button></div>
      <a id="image-link" target="_blank" rel="noopener"><img id="preview" alt="Image attached to your draft"></a>
    </div>
    <label class="sr-only" for="prompt">Message to Simo</label>
    <textarea id="prompt" rows="3" maxlength="12000" placeholder="Message Simo…"></textarea>
    <div class="actions">
      <details id="chat-tools">
        <summary>Tools</summary>
        <button id="pick" type="button" class="quiet">Attach image</button>
      </details>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
      <div class="primary-actions">
        <button id="dictate" type="button" class="quiet" aria-label="Start dictation" aria-pressed="false" title="Start dictation">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="9" y="2" width="6" height="13" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"></path>
          </svg>
        </button>
        <button id="send" type="submit" disabled>Send</button>
      </div>
    </div>
    <a id="mic-permission" href="microphone.html" target="_blank" rel="noopener" hidden>Enable microphone</a>
    <p id="status" role="status"></p>
  </form>
  </section>
  <section id="connect-view" class="panel-view" aria-label="Simo Connect" hidden>
    <p id="connect-status" role="status"></p>
    <a id="connect-full" target="_blank" rel="noopener" hidden>Open Connect in a tab ↗</a>
    <div id="connect-frame"></div>
  </section>
</body>
</html>
